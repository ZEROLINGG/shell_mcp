[package]
name = "terminal-mcp"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Model Context Protocol (MCP) server for long-lived shell execution."
repository = "https://github.com/ZEROLINGG/terminal-mcp"
homepage = "https://github.com/ZEROLINGG"

[dependencies]
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0"

dashmap = "7.0.0-rc2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.24.0", features = ["v4"] }

shell-engine = "0.2.2"

[features]
default = ["pty"]
pty = ["shell-engine/pty"]